<!DOCTYPE html>
<html>
<head>
    <title>Apple Pay 測試 - 簡化版</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://applepay.cdn-apple.com/jsapi/v1/apple-pay-sdk.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        #apple-pay-button {
            -webkit-appearance: -apple-pay-button;
            apple-pay-button-type: buy;
            apple-pay-button-style: black;
            width: 100%;
            height: 45px;
            margin: 20px 0;
            display: none;
        }
        .message {
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            font-size: 14px;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #e2f3f5; color: #0c5460; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍎 Apple Pay 測試</h1>
        
        <div id="message" class="message info">
            檢查 Apple Pay 中...
        </div>
        
        <button id="apple-pay-button"></button>
        
        <div id="debug" style="margin-top: 20px; font-size: 12px; color: #666;"></div>
    </div>

    <script>
    const MERCHANT_ID = 'merchant.com.apple.sandbox.test';
    
    document.addEventListener('DOMContentLoaded', init);

    async function init() {
        if (!window.ApplePaySession) {
            showMessage('請使用 Safari 瀏覽器', 'error');
            return;
        }

        // 檢查 Apple Pay 可用性
        if (ApplePaySession.canMakePayments()) {
            showMessage('Apple Pay 已就緒', 'success');
            document.getElementById('apple-pay-button').style.display = 'block';
        } else {
            showMessage('請先在 Wallet 加入卡片', 'error');
        }
    }

    document.getElementById('apple-pay-button').onclick = startApplePay;

    function startApplePay() {
        try {
            // 最簡單嘅 payment request
            const paymentRequest = {
                countryCode: 'HK',
                currencyCode: 'HKD',
                supportedNetworks: ['visa', 'masterCard', 'amex'],
                merchantCapabilities: ['supports3DS'],
                merchantIdentifier: MERCHANT_ID,
                total: {
                    label: '測試商品',
                    amount: '0.01',
                    type: 'final'
                }
            };

            // 用 version 4 (最穩定)
            const session = new ApplePaySession(4, paymentRequest);

            // 1. Merchant Validation
            session.onvalidatemerchant = (event) => {
                debug('收到 validation URL');
                
                // 官方測試 merchant - 直接回傳基本資料
                session.completeMerchantValidation({
                    merchantIdentifier: MERCHANT_ID,
                    domainName: window.location.hostname,
                    displayName: '測試商店'
                });
                
                debug('商戶驗證完成');
                showMessage('商戶驗證成功 ✓', 'success');
            };

            // 2. Payment Authorization
            session.onpaymentauthorized = (event) => {
                debug('收到支付授權');
                
                // 支付成功！
                const result = {
                    status: ApplePaySession.STATUS_SUCCESS
                };
                
                session.completePayment(result);
                
                showMessage('✅ 支付成功！', 'success');
                debug('交易完成：' + event.payment.token.transactionId);
            };

            // 3. Cancel
            session.oncancel = (event) => {
                showMessage('用戶取消支付', 'info');
                debug('用戶取消');
            };

            // 開始
            session.begin();
            showMessage('請完成 Face ID / Touch ID', 'info');
            
        } catch (error) {
            showMessage('錯誤：' + error.message, 'error');
            debug('Error: ' + error.toString());
        }
    }

    function showMessage(text, type) {
        const msg = document.getElementById('message');
        msg.className = `message ${type}`;
        msg.textContent = text;
    }

    function debug(text) {
        const d = document.getElementById('debug');
        d.innerHTML = d.innerHTML + '<br>' + new Date().toLocaleTimeString() + ': ' + text;
        console.log(text);
    }
    </script>
</body>
</html>
