<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🤬 豆撚寶 · 智能市況</title>
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b0e14;
            color: #e5e7eb;
            padding: 16px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .app-container {
            max-width: 1400px;
            width: 100%;
        }

        /* 頂欄 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-size: 2.4rem;
            filter: drop-shadow(0 0 8px #ff4d4d);
        }

        .title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ff8a8a, #ff4d4d);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .update-badge {
            background: #1f2937;
            padding: 8px 16px;
            border-radius: 40px;
            font-size: 0.85rem;
            color: #9ca3af;
            border: 1px solid #374151;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .update-badge i {
            color: #10b981;
            font-size: 0.7rem;
        }

        /* 幣種導航 (橫向捲動) */
        .coin-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 0 16px 0;
            margin-bottom: 8px;
            scrollbar-width: thin;
            scrollbar-color: #ff4d4d #1f2937;
        }

        .coin-nav::-webkit-scrollbar {
            height: 4px;
        }

        .coin-nav::-webkit-scrollbar-thumb {
            background-color: #ff4d4d;
            border-radius: 20px;
        }

        .coin-tab {
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 40px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.15s ease;
            font-weight: 500;
        }

        .coin-tab:hover {
            background: #2d3748;
            border-color: #ff4d4d;
        }

        .coin-tab.active {
            background: #ff4d4d;
            border-color: #ff4d4d;
            color: white;
            box-shadow: 0 0 15px rgba(255, 77, 77, 0.5);
        }

        .coin-tab .symbol {
            font-weight: 700;
        }

        .coin-tab .price {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .coin-tab .change {
            font-size: 0.8rem;
            padding: 2px 6px;
            border-radius: 20px;
            background: rgba(0,0,0,0.3);
        }

        .change.positive { color: #4ade80; }
        .change.negative { color: #f87171; }

        /* 主要網格 */
        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        @media (max-width: 900px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
        }

        /* K線卡片 */
        .chart-card {
            background: #1a202c;
            border-radius: 28px;
            padding: 20px;
            border: 1px solid #2d3748;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .chart-header h2 {
            font-size: 1.3rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .interval-buttons {
            display: flex;
            gap: 6px;
            background: #1f2937;
            padding: 4px;
            border-radius: 30px;
            border: 1px solid #374151;
        }

        .interval-btn {
            background: transparent;
            border: none;
            color: #9ca3af;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.1s;
        }

        .interval-btn:hover {
            color: white;
        }

        .interval-btn.active {
            background: #ff4d4d;
            color: white;
        }

        .chart-container {
            height: 280px;
            position: relative;
        }

        /* 右側資訊卡片 */
        .info-card {
            background: #1a202c;
            border-radius: 28px;
            padding: 24px;
            border: 1px solid #2d3748;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid #2d3748;
            padding-bottom: 16px;
        }

        .current-price {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .price-change {
            font-size: 1.2rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 40px;
        }

        .price-change.positive { background: rgba(74,222,128,0.1); color: #4ade80; }
        .price-change.negative { background: rgba(248,113,113,0.1); color: #f87171; }

        .metric-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .metric-item {
            background: #1f2937;
            border-radius: 18px;
            padding: 16px;
            border: 1px solid #374151;
        }

        .metric-label {
            font-size: 0.85rem;
            color: #9ca3af;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .metric-value {
            font-size: 1.4rem;
            font-weight: 600;
        }

        .metric-desc {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 4px;
        }

        .rsi-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rsi-bar {
            flex: 1;
            height: 8px;
            background: #2d3748;
            border-radius: 10px;
            overflow: hidden;
        }

        .rsi-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #ffd966, #f87171);
            border-radius: 10px;
        }

        /* 信號區域 */
        .signals-card {
            background: #1a202c;
            border-radius: 28px;
            padding: 24px;
            border: 1px solid #2d3748;
            margin-bottom: 24px;
        }

        .signals-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .signals-header h3 {
            font-size: 1.3rem;
            font-weight: 600;
        }

        .signal-tag {
            background: #ff4d4d20;
            color: #ff8a8a;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 0.8rem;
            border: 1px solid #ff4d4d40;
        }

        .signals-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .signal-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #1f2937;
            border-radius: 18px;
            padding: 16px;
            border-left: 5px solid;
        }

        .signal-item.buy { border-left-color: #4ade80; }
        .signal-item.sell { border-left-color: #f87171; }
        .signal-item.neutral { border-left-color: #fbbf24; }

        .signal-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .buy .signal-icon { background: rgba(74,222,128,0.2); color: #4ade80; }
        .sell .signal-icon { background: rgba(248,113,113,0.2); color: #f87171; }
        .neutral .signal-icon { background: rgba(251,191,36,0.2); color: #fbbf24; }

        .signal-content {
            flex: 1;
        }

        .signal-title {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .signal-desc {
            font-size: 0.85rem;
            color: #9ca3af;
        }

        .signal-strength {
            font-size: 0.8rem;
            background: #2d3748;
            padding: 4px 10px;
            border-radius: 40px;
            color: #d1d5db;
        }

        /* 建議卡片 */
        .recommend-card {
            background: linear-gradient(145deg, #1f2937, #111827);
            border-radius: 28px;
            padding: 28px;
            border: 1px solid #ff4d4d60;
            box-shadow: 0 15px 30px -10px #ff4d4d20;
        }

        .rec-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 20px;
        }

        .rec-action {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .rec-confidence {
            font-size: 1.2rem;
            background: #2d3748;
            padding: 8px 20px;
            border-radius: 60px;
            border: 1px solid #4b5563;
        }

        .confidence-bar {
            height: 12px;
            background: #2d3748;
            border-radius: 30px;
            overflow: hidden;
            margin: 16px 0;
        }

        .confidence-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f87171, #fbbf24, #4ade80);
            border-radius: 30px;
            transition: width 0.5s ease;
        }

        .risk-warning {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #2d3748;
            border-radius: 20px;
            padding: 12px 20px;
            font-size: 0.9rem;
            color: #fbbf24;
            border: 1px solid #fbbf2440;
        }

        /* Loading */
        .skeleton {
            background: linear-gradient(90deg, #1f2937 25%, #2d3748 50%, #1f2937 75%);
            background-size: 200% 100%;
            animation: loading 1.5s infinite;
            border-radius: 8px;
        }

        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .hidden {
            display: none;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #6b7280;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- 頂欄 -->
        <div class="header">
            <div class="logo-area">
                <span class="logo">🤬</span>
                <span class="title">豆撚寶·即市</span>
            </div>
            <div class="update-badge" id="updateBadge">
                <i class="fas fa-circle"></i>
                <span id="updateTime">載入中...</span>
            </div>
        </div>

        <!-- 幣種橫向導航 (動態產生) -->
        <div class="coin-nav" id="coinNav"></div>

        <!-- 主要網格 -->
        <div class="main-grid">
            <!-- 左: K線圖 -->
            <div class="chart-card">
                <div class="chart-header">
                    <h2><i class="fas fa-chart-line" style="color: #ff8a8a;"></i> <span id="chartTitle">BTC/USD</span></h2>
                    <div class="interval-buttons" id="intervalGroup">
                        <button class="interval-btn active" data-days="1">24H</button>
                        <button class="interval-btn" data-days="7">7D</button>
                        <button class="interval-btn" data-days="30">30D</button>
                    </div>
                </div>
                <div class="chart-container">
                    <canvas id="priceChart"></canvas>
                </div>
            </div>

            <!-- 右: 價格資訊 + 指標 -->
            <div class="info-card" id="infoPanel">
                <div class="price-row">
                    <div>
                        <div style="color: #9ca3af; font-size: 0.9rem;">即時價格</div>
                        <div class="current-price" id="currentPrice">---</div>
                    </div>
                    <div class="price-change" id="priceChange">---</div>
                </div>
                <div class="metric-grid">
                    <div class="metric-item">
                        <div class="metric-label"><i class="fas fa-arrow-up" style="color: #4ade80;"></i> 24h 最高</div>
                        <div class="metric-value" id="highPrice">---</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label"><i class="fas fa-arrow-down" style="color: #f87171;"></i> 24h 最低</div>
                        <div class="metric-value" id="lowPrice">---</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label"><i class="fas fa-chart-bar"></i> 24h 成交量</div>
                        <div class="metric-value" id="volume">---</div>
                    </div>
                    <div class="metric-item">
                        <div class="metric-label"><i class="fas fa-weight-hanging"></i> RSI(14)</div>
                        <div class="metric-value" id="rsiValue">---</div>
                        <div class="rsi-indicator" id="rsiIndicator">
                            <div class="rsi-bar"><div class="rsi-fill" id="rsiFill" style="width: 50%;"></div></div>
                            <span id="rsiStatus">中性</span>
                        </div>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; justify-content: space-between;">
                    <div><span class="metric-label">📈 趨勢</span> <span id="trendText" style="font-weight: 600;"></span></div>
                    <div><span class="metric-label">🎯 支撐/阻力</span> <span id="srText">-- / --</span></div>
                </div>
            </div>
        </div>

        <!-- 信號區域 -->
        <div class="signals-card">
            <div class="signals-header">
                <h3><i class="fas fa-bolt" style="color: #fbbf24;"></i> 即時信號</h3>
                <span class="signal-tag" id="signalCount">0 個信號</span>
            </div>
            <div class="signals-list" id="signalsList">
                <div class="signal-item neutral">
                    <div class="signal-icon"><i class="fas fa-minus"></i></div>
                    <div class="signal-content">
                        <div class="signal-title">載入數據中...</div>
                        <div class="signal-desc">請稍候</div>
                    </div>
                    <div class="signal-strength">--</div>
                </div>
            </div>
        </div>

        <!-- 建議卡片 -->
        <div class="recommend-card" id="recommendCard">
            <div class="rec-row">
                <span class="rec-action" id="recAction">觀望</span>
                <span class="rec-confidence" id="recConfidence">信心指數 50%</span>
            </div>
            <div class="confidence-bar">
                <div class="confidence-fill" id="confidenceFill" style="width: 50%;"></div>
            </div>
            <div class="risk-warning">
                <i class="fas fa-exclamation-triangle"></i>
                <span>柒頭都會輸錢，自己諗過！</span>
            </div>
        </div>

        <div class="footer">
            🤬 數據來自 CoinGecko · 每分鐘更新 · 唔係投資建議
        </div>
    </div>

    <script>
        (function() {
            // ----- 幣種列表 (CoinGecko ID, 符號, 名稱) -----
            const COINS = [
                { id: 'bitcoin', symbol: 'BTC', name: '比特幣' },
                { id: 'ethereum', symbol: 'ETH', name: '以太坊' },
                { id: 'binancecoin', symbol: 'BNB', name: '幣安幣' },
                { id: 'solana', symbol: 'SOL', name: '索拉納' },
                { id: 'dogecoin', symbol: 'DOGE', name: '狗狗幣' },
                { id: 'ripple', symbol: 'XRP', name: '瑞波幣' },
                { id: 'cardano', symbol: 'ADA', name: '艾達幣' },
                { id: 'avalanche-2', symbol: 'AVAX', name: '雪崩' },
                { id: 'polkadot', symbol: 'DOT', name: '波卡' },
                { id: 'matic-network', symbol: 'MATIC', name: 'Polygon' }
            ];

            // 當前選擇的幣種ID
            let currentCoinId = 'bitcoin';
            let currentDays = 1;        // 圖表天數 (1,7,30)
            let chartInstance = null;
            let priceUpdateInterval = null;

            // DOM 元素
            const coinNav = document.getElementById('coinNav');
            const chartTitle = document.getElementById('chartTitle');
            const updateTimeEl = document.getElementById('updateTime');
            const updateBadge = document.getElementById('updateBadge');
            const intervalButtons = document.querySelectorAll('.interval-btn');

            // 初始化幣種導航
            function renderCoinNav() {
                coinNav.innerHTML = '';
                COINS.forEach(coin => {
                    const tab = document.createElement('div');
                    tab.className = `coin-tab ${coin.id === currentCoinId ? 'active' : ''}`;
                    tab.setAttribute('data-id', coin.id);
                    tab.innerHTML = `
                        <span class="symbol">${coin.symbol}</span>
                        <span class="price" id="nav-price-${coin.id}">---</span>
                        <span class="change" id="nav-change-${coin.id}"></span>
                    `;
                    tab.addEventListener('click', () => switchCoin(coin.id));
                    coinNav.appendChild(tab);
                });
            }

            // 切換幣種
            async function switchCoin(coinId) {
                if (coinId === currentCoinId) return;
                currentCoinId = coinId;
                // 更新active樣式
                document.querySelectorAll('.coin-tab').forEach(tab => {
                    if (tab.dataset.id === coinId) tab.classList.add('active');
                    else tab.classList.remove('active');
                });
                chartTitle.innerText = coinIdToSymbol(coinId) + '/USD';
                await fetchCoinDetail(coinId);
                await fetchMarketChart(coinId, currentDays);
            }

            // ID轉符號
            function coinIdToSymbol(id) {
                const c = COINS.find(c => c.id === id);
                return c ? c.symbol : 'BTC';
            }

            // 格式化數字
            function formatPrice(price) {
                if (price > 1000) return price.toFixed(2);
                if (price > 1) return price.toFixed(3);
                return price.toFixed(6);
            }

            function formatVolume(vol) {
                if (vol > 1e9) return (vol / 1e9).toFixed(2) + 'B';
                if (vol > 1e6) return (vol / 1e6).toFixed(2) + 'M';
                if (vol > 1e3) return (vol / 1e3).toFixed(2) + 'K';
                return vol.toFixed(2);
            }

            // 更新所有幣種的導航價格 (批量獲取)
            async function fetchAllPrices() {
                try {
                    const ids = COINS.map(c => c.id).join(',');
                    const url = `https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`;
                    const res = await fetch(url);
                    const data = await res.json();
                    for (let coin of COINS) {
                        const price = data[coin.id]?.usd;
                        const change = data[coin.id]?.usd_24h_change;
                        if (price !== undefined) {
                            const priceSpan = document.getElementById(`nav-price-${coin.id}`);
                            const changeSpan = document.getElementById(`nav-change-${coin.id}`);
                            if (priceSpan) priceSpan.innerText = '$' + formatPrice(price);
                            if (changeSpan) {
                                changeSpan.innerText = change > 0 ? '+' + change.toFixed(1) + '%' : change.toFixed(1) + '%';
                                changeSpan.className = `change ${change >= 0 ? 'positive' : 'negative'}`;
                            }
                        }
                    }
                    updateTimeEl.innerText = '剛剛更新';
                } catch (e) {
                    console.warn('批量價格更新失敗', e);
                    updateTimeEl.innerText = '更新失敗';
                }
            }

            // 獲取單一幣種詳細數據 (市場資料)
            async function fetchCoinDetail(coinId) {
                try {
                    const url = `https://api.coingecko.com/api/v3/coins/${coinId}?localization=false&tickers=false&market_data=true&community_data=false&developer_data=false`;
                    const res = await fetch(url);
                    const data = await res.json();
                    const market = data.market_data;
                    // 更新info panel
                    const current = market.current_price.usd;
                    const change = market.price_change_percentage_24h;
                    document.getElementById('currentPrice').innerText = '$' + formatPrice(current);
                    const changeEl = document.getElementById('priceChange');
                    changeEl.innerText = (change > 0 ? '+' : '') + change.toFixed(2) + '%';
                    changeEl.className = `price-change ${change >= 0 ? 'positive' : 'negative'}`;

                    document.getElementById('highPrice').innerText = '$' + formatPrice(market.high_24h.usd);
                    document.getElementById('lowPrice').innerText = '$' + formatPrice(market.low_24h.usd);
                    document.getElementById('volume').innerText = formatVolume(market.total_volume.usd);

                    // 簡單RSI模擬 (用change映射)
                    let rsi = 50 + (change * 1.5);
                    rsi = Math.min(100, Math.max(0, rsi));
                    document.getElementById('rsiValue').innerText = rsi.toFixed(1);
                    document.getElementById('rsiFill').style.width = (rsi / 100 * 100) + '%';
                    let rsiStatus = '中性';
                    if (rsi > 70) rsiStatus = '超買';
                    else if (rsi < 30) rsiStatus = '超賣';
                    document.getElementById('rsiStatus').innerText = rsiStatus;

                    // 趨勢
                    const trend = change >= 0 ? '📈 上升' : '📉 下降';
                    document.getElementById('trendText').innerHTML = trend;

                    // 支撐阻力 (簡單估算)
                    const low = market.low_24h.usd;
                    const high = market.high_24h.usd;
                    const support = (low * 0.98).toFixed(2);
                    const resist = (high * 1.02).toFixed(2);
                    document.getElementById('srText').innerHTML = `$${support} / $${resist}`;

                    // 生成信號 (模擬)
                    generateSignals(market, rsi);

                } catch (e) {
                    console.error('獲取詳細數據失敗', e);
                }
            }

            // 生成信號 (模擬)
            function generateSignals(market, rsi) {
                const signals = [];
                const change = market.price_change_percentage_24h;

                if (rsi > 70) {
                    signals.push({ type: 'sell', title: 'RSI 超賣', desc: '短期可能回調', strength: 75 });
                } else if (rsi < 30) {
                    signals.push({ type: 'buy', title: 'RSI 超賣', desc: '短期可能反彈', strength: 75 });
                }

                if (Math.abs(change) > 5) {
                    signals.push({
                        type: change > 0 ? 'buy' : 'sell',
                        title: '強烈趨勢',
                        desc: `24h 變化 ${change > 0 ? '+' : ''}${change.toFixed(1)}%`,
                        strength: 65
                    });
                }

                // 成交量信號 (粗略)
                if (market.total_volume.usd > market.market_cap.usd * 0.3) {
                    signals.push({
                        type: change > 0 ? 'buy' : 'sell',
                        title: '成交量放大',
                        desc: '量能增加，趨勢可能延續',
                        strength: 60
                    });
                }

                if (signals.length === 0) {
                    signals.push({ type: 'neutral', title: '無明顯信號', desc: '市場平穩', strength: 0 });
                }

                renderSignals(signals);
                updateRecommendation(signals, change);
                document.getElementById('signalCount').innerText = signals.length + ' 個信號';
            }

            function renderSignals(signals) {
                const list = document.getElementById('signalsList');
                list.innerHTML = signals.map(s => `
                    <div class="signal-item ${s.type}">
                        <div class="signal-icon"><i class="fas ${s.type === 'buy' ? 'fa-arrow-up' : s.type === 'sell' ? 'fa-arrow-down' : 'fa-minus'}"></i></div>
                        <div class="signal-content">
                            <div class="signal-title">${s.title}</div>
                            <div class="signal-desc">${s.desc}</div>
                        </div>
                        <div class="signal-strength">強度 ${s.strength}%</div>
                    </div>
                `).join('');
            }

            function updateRecommendation(signals, change) {
                let buyScore = 50, sellScore = 50;
                signals.forEach(s => {
                    if (s.type === 'buy') buyScore += s.strength / 2;
                    if (s.type === 'sell') sellScore += s.strength / 2;
                });
                buyScore += Math.max(0, change * 2);
                sellScore += Math.max(0, -change * 2);
                const total = buyScore + sellScore;
                const buyRatio = buyScore / total;

                let action, confidence, color;
                if (buyRatio > 0.6) { action = '買入'; confidence = buyRatio * 100; color = '#4ade80'; }
                else if (buyRatio < 0.4) { action = '賣出'; confidence = (1 - buyRatio) * 100; color = '#f87171'; }
                else { action = '觀望'; confidence = 50; color = '#fbbf24'; }

                document.getElementById('recAction').innerText = action;
                document.getElementById('recAction').style.color = color;
                document.getElementById('recConfidence').innerHTML = `信心指數 ${confidence.toFixed(1)}%`;
                document.getElementById('confidenceFill').style.width = confidence + '%';
            }

            // 獲取K線數據
            async function fetchMarketChart(coinId, days) {
                try {
                    const url = `https://api.coingecko.com/api/v3/coins/${coinId}/market_chart?vs_currency=usd&days=${days}`;
                    const res = await fetch(url);
                    const data = await res.json();
                    const prices = data.prices; // [timestamp, price]
                    updateChart(prices, days);
                } catch (e) {
                    console.error('K線獲取失敗', e);
                }
            }

            function updateChart(prices, days) {
                if (!chartInstance) {
                    const ctx = document.getElementById('priceChart').getContext('2d');
                    chartInstance = new Chart(ctx, {
                        type: 'line',
                        data: { labels: [], datasets: [{
                            label: '價格 (USD)',
                            data: [],
                            borderColor: '#ff4d4d',
                            backgroundColor: 'rgba(255,77,77,0.1)',
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.1,
                            fill: true
                        }] },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                x: { grid: { color: '#2d3748' }, ticks: { color: '#9ca3af', maxTicksLimit: 8 } },
                                y: { grid: { color: '#2d3748' }, ticks: { color: '#9ca3af' } }
                            },
                            elements: { point: { radius: 0 } }
                        }
                    });
                }

                // 取最近100點 (或全部)
                const points = prices.slice(-100);
                const labels = points.map(p => {
                    const d = new Date(p[0]);
                    return days <= 1 ? d.getHours() + ':' + (d.getMinutes() < 10 ? '0' : '') + d.getMinutes() : d.toLocaleDateString('zh-HK', { month: 'numeric', day: 'numeric' });
                });
                const values = points.map(p => p[1]);

                chartInstance.data.labels = labels;
                chartInstance.data.datasets[0].data = values;
                chartInstance.update();
            }

            // 切換天數
            function switchDays(days) {
                currentDays = days;
                intervalButtons.forEach(btn => {
                    btn.classList.remove('active');
                    if (parseInt(btn.dataset.days) === days) btn.classList.add('active');
                });
                fetchMarketChart(currentCoinId, days);
            }

            // 初始化
            async function init() {
                renderCoinNav();
                // 綁定時間按鈕
                intervalButtons.forEach(btn => {
                    btn.addEventListener('click', () => switchDays(parseInt(btn.dataset.days)));
                });
                // 第一次獲取全部價格
                await fetchAllPrices();
                await fetchCoinDetail(currentCoinId);
                await fetchMarketChart(currentCoinId, currentDays);
                // 定時更新 (每60秒)
                priceUpdateInterval = setInterval(() => {
                    fetchAllPrices();
                    fetchCoinDetail(currentCoinId);
                    // 圖表唔一定要更新太密，optional
                }, 60000);
            }

            init();

            // 清理定時器
            window.addEventListener('beforeunload', () => {
                if (priceUpdateInterval) clearInterval(priceUpdateInterval);
            });

        })();
    </script>
</body>
</html>
