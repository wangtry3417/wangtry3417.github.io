<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤬 豆撚寶 - 終極動態市場分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0c0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #ff3b30 0%, #ff6b6b 100%);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(255,59,48,0.3);
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: "🤬";
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 80px;
            opacity: 0.2;
        }
        
        .header h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 18px;
            opacity: 0.9;
        }
        
        .update-time {
            position: absolute;
            bottom: 15px;
            right: 30px;
            font-size: 14px;
            opacity: 0.7;
        }
        
        /* Market Overview */
        .market-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .overview-card {
            background: #1e2225;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #2a2f33;
            transition: all 0.2s;
        }
        
        .overview-card:hover {
            transform: translateY(-5px);
            border-color: #ff3b30;
            box-shadow: 0 5px 20px rgba(255,59,48,0.2);
        }
        
        .card-title {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .card-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .card-sub {
            font-size: 12px;
            color: #8e8e93;
        }
        
        .positive { color: #4cd964; }
        .negative { color: #ff3b30; }
        
        /* 控制欄 */
        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #1e2225;
            padding: 15px 20px;
            border-radius: 15px;
            border: 1px solid #2a2f33;
        }
        
        .coin-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .coin-btn {
            background: #2a2f33;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .coin-btn:hover {
            background: #ff3b30;
            transform: scale(1.05);
        }
        
        .coin-btn.active {
            background: #ff3b30;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(255,59,48,0.5);
        }
        
        .interval-selector {
            display: flex;
            gap: 5px;
        }
        
        .interval-btn {
            background: #2a2f33;
            border: none;
            color: #8e8e93;
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .interval-btn:hover {
            background: #ff3b30;
            color: white;
        }
        
        .interval-btn.active {
            background: #ff3b30;
            color: white;
        }
        
        /* K線圖 */
        .chart-container {
            background: #1e2225;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #2a2f33;
            height: 500px;
        }
        
        /* 分析網格 */
        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: #1e2225;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #2a2f33;
            transition: all 0.2s;
        }
        
        .metric-card:hover {
            border-color: #ff3b30;
        }
        
        .metric-title {
            color: #8e8e93;
            font-size: 13px;
            margin-bottom: 10px;
        }
        
        .metric-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .metric-desc {
            font-size: 12px;
            color: #8e8e93;
        }
        
        /* 信號列表 */
        .signals-container {
            background: #1e2225;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2a2f33;
        }
        
        .signals-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #ff3b30;
        }
        
        .signals-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        
        .signal-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #2a2f33;
            border-radius: 10px;
            border-left: 3px solid;
        }
        
        .signal-buy { border-left-color: #4cd964; }
        .signal-sell { border-left-color: #ff3b30; }
        .signal-neutral { border-left-color: #ffd700; }
        
        .signal-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .signal-buy .signal-icon { background: rgba(76,217,100,0.2); color: #4cd964; }
        .signal-sell .signal-icon { background: rgba(255,59,48,0.2); color: #ff3b30; }
        .signal-neutral .signal-icon { background: rgba(255,215,0,0.2); color: #ffd700; }
        
        .signal-text {
            flex: 1;
            font-size: 14px;
        }
        
        .signal-strength {
            font-size: 12px;
            color: #8e8e93;
        }
        
        /* 建議卡片 */
        .recommendation-card {
            background: linear-gradient(135deg, #2a2f33 0%, #1e2225 100%);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            border: 2px solid #ff3b30;
            position: relative;
            overflow: hidden;
        }
        
        .rec-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .rec-action {
            font-size: 36px;
            font-weight: 800;
        }
        
        .rec-confidence {
            font-size: 18px;
            color: #8e8e93;
        }
        
        .confidence-bar {
            width: 100%;
            height: 10px;
            background: #2a2f33;
            border-radius: 5px;
            overflow: hidden;
            margin: 15px 0;
        }
        
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff3b30, #ffd700, #4cd964);
            border-radius: 5px;
            transition: width 0.5s;
        }
        
        .risk-warning {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255,59,48,0.1);
            border-left: 3px solid #ff3b30;
            color: #ff8a80;
            font-size: 14px;
        }
        
        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,59,48,0.3);
            border-radius: 50%;
            border-top-color: #ff3b30;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 響應式 */
        @media (max-width: 768px) {
            .analysis-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .control-bar {
                flex-direction: column;
                gap: 15px;
            }
            
            .coin-selector {
                justify-content: center;
            }
        }
        
        @media (max-width: 480px) {
            .analysis-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🤬 豆撚寶終極動態分析</h1>
            <p>Binance即時數據 · AI分析 · K線圖</p>
            <div class="update-time" id="updateTime">更新中...</div>
        </div>
        
        <!-- Market Overview -->
        <div class="market-overview" id="marketOverview">
            <div class="overview-card">
                <div class="loading" id="btcLoading"></div>
                <div class="card-title">🪙 BTC/USDT</div>
                <div class="card-value" id="btcPrice">--</div>
                <div class="card-sub" id="btcChange">--</div>
            </div>
            <div class="overview-card">
                <div class="loading" id="ethLoading"></div>
                <div class="card-title">💎 ETH/USDT</div>
                <div class="card-value" id="ethPrice">--</div>
                <div class="card-sub" id="ethChange">--</div>
            </div>
            <div class="overview-card">
                <div class="loading" id="bnbLoading"></div>
                <div class="card-title">🏦 BNB/USDT</div>
                <div class="card-value" id="bnbPrice">--</div>
                <div class="card-sub" id="bnbChange">--</div>
            </div>
            <div class="overview-card">
                <div class="loading" id="solLoading"></div>
                <div class="card-title">⚡ SOL/USDT</div>
                <div class="card-value" id="solPrice">--</div>
                <div class="card-sub" id="solChange">--</div>
            </div>
        </div>
        
        <!-- 控制欄 -->
        <div class="control-bar">
            <div class="coin-selector" id="coinSelector">
                <button class="coin-btn active" onclick="changeSymbol('BTCUSDT')">BTC/USDT</button>
                <button class="coin-btn" onclick="changeSymbol('ETHUSDT')">ETH/USDT</button>
                <button class="coin-btn" onclick="changeSymbol('BNBUSDT')">BNB/USDT</button>
                <button class="coin-btn" onclick="changeSymbol('SOLUSDT')">SOL/USDT</button>
                <button class="coin-btn" onclick="changeSymbol('DOGEUSDT')">DOGE/USDT</button>
                <button class="coin-btn" onclick="changeSymbol('XRPUSDT')">XRP/USDT</button>
            </div>
            <div class="interval-selector" id="intervalSelector">
                <button class="interval-btn active" onclick="changeInterval('1d')">1d</button>
                <button class="interval-btn" onclick="changeInterval('4h')">4h</button>
                <button class="interval-btn" onclick="changeInterval('1h')">1h</button>
                <button class="interval-btn" onclick="changeInterval('15m')">15m</button>
                <button class="interval-btn" onclick="changeInterval('5m')">5m</button>
            </div>
        </div>
        
        <!-- K線圖 -->
        <div class="chart-container">
            <canvas id="klineChart"></canvas>
        </div>
        
        <!-- 分析網格 -->
        <div class="analysis-grid" id="analysisGrid">
            <div class="metric-card">
                <div class="metric-title">💰 當前價格</div>
                <div class="metric-value" id="currentPrice">--</div>
                <div class="metric-desc" id="priceRange">24h高/低: --</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">📊 RSI (14)</div>
                <div class="metric-value" id="rsiValue">--</div>
                <div class="metric-desc" id="rsiDesc">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">📈 趨勢</div>
                <div class="metric-value" id="trend">--</div>
                <div class="metric-desc" id="trendStrength">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">🎯 支撐/阻力</div>
                <div class="metric-value" id="supportResistance">--</div>
                <div class="metric-desc" id="srDistance">--</div>
            </div>
        </div>
        
        <!-- 信號列表 -->
        <div class="signals-container">
            <div class="signals-title">📡 即時買賣信號</div>
            <div class="signals-list" id="signalsList">
                <div class="signal-item signal-neutral">
                    <div class="signal-icon">⚪</div>
                    <div class="signal-text">載入數據中...</div>
                </div>
            </div>
        </div>
        
        <!-- 建議卡片 -->
        <div class="recommendation-card" id="recommendation">
            <div class="rec-header">
                <div class="rec-action" id="recAction">--</div>
                <div class="rec-confidence" id="recConfidence">--</div>
            </div>
            <div class="confidence-bar">
                <div class="confidence-fill" id="confidenceFill" style="width: 0%"></div>
            </div>
            <div class="risk-warning" id="riskWarning">
                ⚠️ 柒頭都會輸錢，自己諗過！
            </div>
        </div>
    </div>

    <script>
        // ==================== 配置 ====================
        const BINANCE_API = 'https://api.binance.com/api/v3';
        let currentSymbol = 'BTCUSDT';
        let currentInterval = '1d';
        let chart = null;
        let updateInterval = null;
        
        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', function() {
            initChart();
            fetchAllData();
            
            // 定時更新 (每10秒)
            updateInterval = setInterval(fetchAllData, 10000);
        });
        
        // ==================== 初始化圖表 ====================
        function initChart() {
            const ctx = document.getElementById('klineChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'candlestick',
                data: {
                    datasets: [{
                        label: 'K線圖',
                        data: [],
                        color: {
                            up: '#4cd964',
                            down: '#ff3b30',
                            unchanged: '#8e8e93',
                        }
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: true }
                    },
                    scales: {
                        x: { 
                            type: 'time',
                            time: { unit: 'day' },
                            grid: { color: '#2a2f33' }
                        },
                        y: { 
                            grid: { color: '#2a2f33' }
                        }
                    }
                }
            });
        }
        
        // ==================== 獲取所有數據 ====================
        async function fetchAllData() {
            await Promise.all([
                fetchTicker('BTCUSDT'),
                fetchTicker('ETHUSDT'),
                fetchTicker('BNBUSDT'),
                fetchTicker('SOLUSDT'),
                fetchKlineData(currentSymbol, currentInterval)
            ]);
            
            document.getElementById('updateTime').textContent = 
                '最後更新: ' + new Date().toLocaleTimeString('zh-HK');
        }
        
        // ==================== 獲取Ticker數據 ====================
        async function fetchTicker(symbol) {
            try {
                const response = await fetch(`${BINANCE_API}/ticker/24hr?symbol=${symbol}`);
                const data = await response.json();
                
                const price = parseFloat(data.lastPrice).toFixed(2);
                const change = parseFloat(data.priceChangePercent).toFixed(2);
                const high = parseFloat(data.highPrice).toFixed(2);
                const low = parseFloat(data.lowPrice).toFixed(2);
                
                // 更新對應元素
                const prefix = symbol.replace('USDT', '').toLowerCase();
                document.getElementById(`${prefix}Price`).textContent = '$' + price;
                document.getElementById(`${prefix}Change`).textContent = change + '%';
                document.getElementById(`${prefix}Change`).className = 
                    parseFloat(change) >= 0 ? 'card-sub positive' : 'card-sub negative';
                document.getElementById(`${prefix}Loading`).style.display = 'none';
                
                // 如果係當前選擇嘅幣種，更新詳細數據
                if (symbol === currentSymbol) {
                    document.getElementById('currentPrice').textContent = '$' + price;
                    document.getElementById('priceRange').textContent = 
                        `24h高: $${high} | 低: $${low}`;
                    
                    // 計算RSI
                    const rsi = calculateRSI(data);
                    document.getElementById('rsiValue').textContent = rsi.toFixed(1);
                    const rsiDesc = rsi > 70 ? '超買' : rsi < 30 ? '超賣' : '中性';
                    document.getElementById('rsiDesc').textContent = rsiDesc;
                    document.getElementById('rsiValue').style.color = 
                        rsi > 70 ? '#ff3b30' : rsi < 30 ? '#4cd964' : '#ffd700';
                    
                    // 趨勢
                    const trend = parseFloat(change) >= 0 ? '上升' : '下降';
                    document.getElementById('trend').textContent = trend;
                    document.getElementById('trendStrength').textContent = 
                        `強度: ${Math.abs(parseFloat(change))}%`;
                    document.getElementById('trend').style.color = 
                        trend === '上升' ? '#4cd964' : '#ff3b30';
                    
                    // 支撐阻力 (簡單計算)
                    const support = (parseFloat(low) * 0.95).toFixed(2);
                    const resistance = (parseFloat(high) * 1.05).toFixed(2);
                    document.getElementById('supportResistance').textContent = 
                        `$${support} / $${resistance}`;
                    
                    // 生成信號
                    generateSignals(data, rsi);
                }
                
            } catch (error) {
                console.error(`Error fetching ${symbol}:`, error);
            }
        }
        
        // ==================== 獲取K線數據 ====================
        async function fetchKlineData(symbol, interval) {
            try {
                const response = await fetch(
                    `${BINANCE_API}/klines?symbol=${symbol}&interval=${interval}&limit=100`
                );
                const data = await response.json();
                
                const candlestickData = data.map(k => ({
                    x: new Date(k[0]),
                    o: parseFloat(k[1]),
                    h: parseFloat(k[2]),
                    l: parseFloat(k[3]),
                    c: parseFloat(k[4])
                }));
                
                updateChart(candlestickData);
                
            } catch (error) {
                console.error('Error fetching kline data:', error);
            }
        }
        
        // ==================== 更新圖表 ====================
        function updateChart(data) {
            if (!chart) return;
            
            chart.data.datasets[0].data = data;
            chart.update();
        }
        
        // ==================== 計算RSI ====================
        function calculateRSI(data) {
            // 簡單RSI計算
            const change = parseFloat(data.priceChange);
            if (change > 0) {
                return 50 + Math.min(change * 2, 50);
            } else {
                return 50 - Math.min(Math.abs(change) * 2, 50);
            }
        }
        
        // ==================== 生成信號 ====================
        function generateSignals(data, rsi) {
            const signals = [];
            const change = parseFloat(data.priceChangePercent);
            const volume = parseFloat(data.volume);
            const quoteVolume = parseFloat(data.quoteVolume);
            
            // RSI信號
            if (rsi > 70) {
                signals.push({
                    type: 'sell',
                    text: 'RSI超買，可能回調',
                    strength: Math.min((rsi - 70) * 3, 30)
                });
            } else if (rsi < 30) {
                signals.push({
                    type: 'buy',
                    text: 'RSI超賣，可能反彈',
                    strength: Math.min((30 - rsi) * 3, 30)
                });
            }
            
            // 成交量信號
            const avgVolume = volume * 0.8; // 簡單估計
            if (volume > avgVolume * 1.5) {
                signals.push({
                    type: change > 0 ? 'buy' : 'sell',
                    text: '成交量異常放大',
                    strength: 25
                });
            }
            
            // 趨勢信號
            if (Math.abs(change) > 5) {
                signals.push({
                    type: change > 0 ? 'buy' : 'sell',
                    text: '強烈趨勢',
                    strength: 20
                });
            }
            
            // 價格位置信號
            const high = parseFloat(data.highPrice);
            const low = parseFloat(data.lowPrice);
            const current = parseFloat(data.lastPrice);
            const position = (current - low) / (high - low);
            
            if (position > 0.8) {
                signals.push({
                    type: 'sell',
                    text: '接近24h高位',
                    strength: 15
                });
            } else if (position < 0.2) {
                signals.push({
                    type: 'buy',
                    text: '接近24h低位',
                    strength: 15
                });
            }
            
            // 更新信號列表
            updateSignalsList(signals);
            
            // 更新建議
            updateRecommendation(signals, change);
        }
        
        // ==================== 更新信號列表 ====================
        function updateSignalsList(signals) {
            const container = document.getElementById('signalsList');
            
            if (signals.length === 0) {
                container.innerHTML = `
                    <div class="signal-item signal-neutral">
                        <div class="signal-icon">⚪</div>
                        <div class="signal-text">無明顯信號</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = signals.map(s => `
                <div class="signal-item signal-${s.type}">
                    <div class="signal-icon">${s.type === 'buy' ? '🟢' : s.type === 'sell' ? '🔴' : '⚪'}</div>
                    <div class="signal-text">${s.text}</div>
                    <div class="signal-strength">強度: ${s.strength}%</div>
                </div>
            `).join('');
        }
        
        // ==================== 更新建議 ====================
        function updateRecommendation(signals, change) {
            let buyScore = 50;
            let sellScore = 50;
            
            signals.forEach(s => {
                if (s.type === 'buy') buyScore += s.strength;
                if (s.type === 'sell') sellScore += s.strength;
            });
            
            // 加入趨勢影響
            if (change > 0) buyScore += Math.min(change, 20);
            if (change < 0) sellScore += Math.min(Math.abs(change), 20);
            
            const total = buyScore + sellScore;
            const buyRatio = buyScore / total;
            
            let action, confidence, color;
            if (buyRatio > 0.6) {
                action = '買入';
                confidence = Math.min(buyRatio * 100, 95);
                color = '#4cd964';
            } else if (buyRatio < 0.4) {
                action = '賣出';
                confidence = Math.min((1 - buyRatio) * 100, 95);
                color = '#ff3b30';
            } else {
                action = '觀望';
                confidence = 50;
                color = '#ffd700';
            }
            
            document.getElementById('recAction').textContent = action;
            document.getElementById('recAction').style.color = color;
            document.getElementById('recConfidence').textContent = `信心指數: ${confidence.toFixed(1)}%`;
            document.getElementById('confidenceFill').style.width = confidence + '%';
        }
        
        // ==================== 改變幣種 ====================
        function changeSymbol(symbol) {
            currentSymbol = symbol;
            
            // 更新active狀態
            document.querySelectorAll('.coin-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.includes(symbol.replace('USDT', ''))) {
                    btn.classList.add('active');
                }
            });
            
            // 重新獲取K線數據
            fetchKlineData(currentSymbol, currentInterval);
            fetchTicker(currentSymbol);
        }
        
        // ==================== 改變時間間隔 ====================
        function changeInterval(interval) {
            currentInterval = interval;
            
            // 更新active狀態
            document.querySelectorAll('.interval-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === interval) {
                    btn.classList.add('active');
                }
            });
            
            // 重新獲取K線數據
            fetchKlineData(currentSymbol, currentInterval);
        }
        
        // ==================== 清理 ====================
        window.addEventListener('beforeunload', function() {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        });
    </script>
</body>
</html>
