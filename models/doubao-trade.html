<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤬 豆撚寶 - 終極動態市場分析</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0a0c0f;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
        }
        
        /* Header */
        .header {
            background: linear-gradient(135deg, #ff3b30 0%, #ff6b6b 100%);
            padding: 30px;
            border-radius: 20px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(255,59,48,0.3);
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: "🤬";
            position: absolute;
            right: 30px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 80px;
            opacity: 0.2;
        }
        
        .header h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 3px 3px 0 rgba(0,0,0,0.2);
        }
        
        .header p {
            font-size: 18px;
            opacity: 0.9;
        }
        
        .update-time {
            position: absolute;
            bottom: 15px;
            right: 30px;
            font-size: 14px;
            opacity: 0.7;
        }
        
        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(10,12,15,0.9);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            gap: 20px;
        }
        
        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #2a2f33;
            border-top-color: #ff3b30;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: #ff3b30;
            font-size: 20px;
            font-weight: bold;
        }
        
        /* Market Overview */
        .market-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .overview-card {
            background: #1e2225;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #2a2f33;
            transition: all 0.2s;
            position: relative;
            min-height: 120px;
        }
        
        .overview-card.loading {
            opacity: 0.5;
        }
        
        .overview-card .loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 30px;
            height: 30px;
            border: 3px solid #2a2f33;
            border-top-color: #ff3b30;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        .card-title {
            color: #8e8e93;
            font-size: 14px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .card-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .card-sub {
            font-size: 12px;
            color: #8e8e93;
        }
        
        .positive { color: #4cd964; }
        .negative { color: #ff3b30; }
        
        /* 控制欄 */
        .control-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #1e2225;
            padding: 15px 20px;
            border-radius: 15px;
            border: 1px solid #2a2f33;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .coin-selector {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .coin-btn {
            background: #2a2f33;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .coin-btn:hover:not(:disabled) {
            background: #ff3b30;
            transform: scale(1.05);
        }
        
        .coin-btn.active {
            background: #ff3b30;
            font-weight: 600;
            box-shadow: 0 0 15px rgba(255,59,48,0.5);
        }
        
        .coin-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .interval-selector {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .interval-btn {
            background: #2a2f33;
            border: none;
            color: #8e8e93;
            padding: 5px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }
        
        .interval-btn:hover:not(:disabled) {
            background: #ff3b30;
            color: white;
        }
        
        .interval-btn.active {
            background: #ff3b30;
            color: white;
        }
        
        .interval-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .retry-btn {
            background: #ff3b30;
            border: none;
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .retry-btn:hover {
            background: #ff5a4a;
        }
        
        /* K線圖 */
        .chart-container {
            background: #1e2225;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #2a2f33;
            height: 500px;
            position: relative;
        }
        
        .chart-error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #ff3b30;
        }
        
        /* 分析網格 */
        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .metric-card {
            background: #1e2225;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #2a2f33;
            transition: all 0.2s;
        }
        
        .metric-card:hover {
            border-color: #ff3b30;
        }
        
        .metric-title {
            color: #8e8e93;
            font-size: 13px;
            margin-bottom: 10px;
        }
        
        .metric-value {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .metric-desc {
            font-size: 12px;
            color: #8e8e93;
        }
        
        /* 信號列表 */
        .signals-container {
            background: #1e2225;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #2a2f33;
        }
        
        .signals-title {
            font-size: 18px;
            margin-bottom: 15px;
            color: #ff3b30;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .signals-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }
        
        .signal-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px;
            background: #2a2f33;
            border-radius: 10px;
            border-left: 3px solid;
        }
        
        .signal-buy { border-left-color: #4cd964; }
        .signal-sell { border-left-color: #ff3b30; }
        .signal-neutral { border-left-color: #ffd700; }
        
        .signal-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        
        .signal-buy .signal-icon { background: rgba(76,217,100,0.2); color: #4cd964; }
        .signal-sell .signal-icon { background: rgba(255,59,48,0.2); color: #ff3b30; }
        .signal-neutral .signal-icon { background: rgba(255,215,0,0.2); color: #ffd700; }
        
        .signal-text {
            flex: 1;
            font-size: 14px;
        }
        
        .signal-strength {
            font-size: 12px;
            color: #8e8e93;
        }
        
        /* 建議卡片 */
        .recommendation-card {
            background: linear-gradient(135deg, #2a2f33 0%, #1e2225 100%);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
            border: 2px solid #ff3b30;
            position: relative;
            overflow: hidden;
        }
        
        .rec-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .rec-action {
            font-size: 36px;
            font-weight: 800;
        }
        
        .rec-confidence {
            font-size: 18px;
            color: #8e8e93;
        }
        
        .confidence-bar {
            width: 100%;
            height: 10px;
            background: #2a2f33;
            border-radius: 5px;
            overflow: hidden;
            margin: 15px 0;
        }
        
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff3b30, #ffd700, #4cd964);
            border-radius: 5px;
            transition: width 0.5s;
        }
        
        .risk-warning {
            margin-top: 15px;
            padding: 10px;
            background: rgba(255,59,48,0.1);
            border-left: 3px solid #ff3b30;
            color: #ff8a80;
            font-size: 14px;
        }
        
        .error-message {
            color: #ff3b30;
            padding: 10px;
            text-align: center;
            background: rgba(255,59,48,0.1);
            border-radius: 10px;
            margin: 10px 0;
        }
        
        /* 響應式 */
        @media (max-width: 768px) {
            .analysis-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .control-bar {
                flex-direction: column;
                align-items: stretch;
            }
            
            .coin-selector {
                justify-content: center;
            }
        }
        
        @media (max-width: 480px) {
            .analysis-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">仆緊去Binance拎數據...</div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🤬 豆撚寶終極動態分析</h1>
            <p>Binance即時數據 · AI分析 · K線圖 · CORS解決</p>
            <div class="update-time" id="updateTime">準備中...</div>
        </div>
        
        <!-- 錯誤訊息 -->
        <div class="error-message" id="errorMessage" style="display: none;"></div>
        
        <!-- Market Overview -->
        <div class="market-overview" id="marketOverview">
            <div class="overview-card" id="btcCard">
                <div class="card-title">🪙 BTC/USDT</div>
                <div class="card-value" id="btcPrice">--</div>
                <div class="card-sub" id="btcChange">--</div>
            </div>
            <div class="overview-card" id="ethCard">
                <div class="card-title">💎 ETH/USDT</div>
                <div class="card-value" id="ethPrice">--</div>
                <div class="card-sub" id="ethChange">--</div>
            </div>
            <div class="overview-card" id="bnbCard">
                <div class="card-title">🏦 BNB/USDT</div>
                <div class="card-value" id="bnbPrice">--</div>
                <div class="card-sub" id="bnbChange">--</div>
            </div>
            <div class="overview-card" id="solCard">
                <div class="card-title">⚡ SOL/USDT</div>
                <div class="card-value" id="solPrice">--</div>
                <div class="card-sub" id="solChange">--</div>
            </div>
        </div>
        
        <!-- 控制欄 -->
        <div class="control-bar">
            <div class="coin-selector" id="coinSelector">
                <button class="coin-btn active" onclick="changeSymbol('BTCUSDT')" id="btnBTC">BTC/USDT</button>
                <button class="coin-btn" onclick="changeSymbol('ETHUSDT')" id="btnETH">ETH/USDT</button>
                <button class="coin-btn" onclick="changeSymbol('BNBUSDT')" id="btnBNB">BNB/USDT</button>
                <button class="coin-btn" onclick="changeSymbol('SOLUSDT')" id="btnSOL">SOL/USDT</button>
                <button class="coin-btn" onclick="changeSymbol('DOGEUSDT')" id="btnDOGE">DOGE/USDT</button>
                <button class="coin-btn" onclick="changeSymbol('XRPUSDT')" id="btnXRP">XRP/USDT</button>
            </div>
            <div class="interval-selector" id="intervalSelector">
                <button class="interval-btn active" onclick="changeInterval('1d')">1d</button>
                <button class="interval-btn" onclick="changeInterval('4h')">4h</button>
                <button class="interval-btn" onclick="changeInterval('1h')">1h</button>
                <button class="interval-btn" onclick="changeInterval('15m')">15m</button>
                <button class="interval-btn" onclick="changeInterval('5m')">5m</button>
            </div>
            <button class="retry-btn" onclick="retryFetch()">
                <span>🔄</span> 重新連線
            </button>
        </div>
        
        <!-- K線圖 -->
        <div class="chart-container">
            <canvas id="klineChart"></canvas>
            <div class="chart-error" id="chartError" style="display: none;">
                <p>❌ 載入K線失敗</p>
                <button class="retry-btn" onclick="retryKline()">重試</button>
            </div>
        </div>
        
        <!-- 分析網格 -->
        <div class="analysis-grid" id="analysisGrid">
            <div class="metric-card">
                <div class="metric-title">💰 當前價格</div>
                <div class="metric-value" id="currentPrice">--</div>
                <div class="metric-desc" id="priceRange">24h高/低: --</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">📊 RSI (14)</div>
                <div class="metric-value" id="rsiValue">--</div>
                <div class="metric-desc" id="rsiDesc">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">📈 趨勢</div>
                <div class="metric-value" id="trend">--</div>
                <div class="metric-desc" id="trendStrength">--</div>
            </div>
            <div class="metric-card">
                <div class="metric-title">🎯 支撐/阻力</div>
                <div class="metric-value" id="supportResistance">--</div>
                <div class="metric-desc" id="srDistance">--</div>
            </div>
        </div>
        
        <!-- 信號列表 -->
        <div class="signals-container">
            <div class="signals-title">
                <span>📡 即時買賣信號</span>
                <span class="signal-strength" id="signalCount">0個信號</span>
            </div>
            <div class="signals-list" id="signalsList">
                <div class="signal-item signal-neutral">
                    <div class="signal-icon">⚪</div>
                    <div class="signal-text">載入數據中...</div>
                </div>
            </div>
        </div>
        
        <!-- 建議卡片 -->
        <div class="recommendation-card" id="recommendation">
            <div class="rec-header">
                <div class="rec-action" id="recAction">--</div>
                <div class="rec-confidence" id="recConfidence">--</div>
            </div>
            <div class="confidence-bar">
                <div class="confidence-fill" id="confidenceFill" style="width: 0%"></div>
            </div>
            <div class="risk-warning" id="riskWarning">
                ⚠️ 柒頭都會輸錢，自己諗過！
            </div>
        </div>
    </div>

    <script>
        // ==================== 配置 ====================
        const BINANCE_API = 'https://api.binance.com/api/v3';
        const BINANCE_CORS_PROXY = 'https://cors-anywhere.herokuapp.com/';
        const USE_PROXY = false; // 如果直接連唔得，轉true
        
        let currentSymbol = 'BTCUSDT';
        let currentInterval = '1d';
        let chart = null;
        let updateInterval = null;
        let retryCount = 0;
        const maxRetries = 3;
        
        // Fallback 數據 (當API死咗用)
        const fallbackData = {
            'BTCUSDT': { price: '43210.50', change: '+2.34', high: '43800', low: '42800' },
            'ETHUSDT': { price: '2345.67', change: '+1.23', high: '2380', low: '2320' },
            'BNBUSDT': { price: '567.89', change: '-0.45', high: '572', low: '565' },
            'SOLUSDT': { price: '123.45', change: '+5.67', high: '126', low: '120' },
            'DOGEUSDT': { price: '0.156', change: '-2.34', high: '0.16', low: '0.155' },
            'XRPUSDT': { price: '0.623', change: '+0.78', high: '0.63', low: '0.62' }
        };
        
        // ==================== 初始化 ====================
        document.addEventListener('DOMContentLoaded', async function() {
            showLoading(true);
            await initChart();
            await fetchAllData();
            showLoading(false);
            
            // 定時更新 (每30秒)
            updateInterval = setInterval(fetchAllData, 30000);
        });
        
        // ==================== 顯示Loading ====================
        function showLoading(show) {
            document.getElementById('loadingOverlay').style.display = show ? 'flex' : 'none';
        }
        
        // ==================== 顯示錯誤 ====================
        function showError(message) {
            const errorEl = document.getElementById('errorMessage');
            errorEl.style.display = 'block';
            errorEl.textContent = '❌ ' + message;
            
            setTimeout(() => {
                errorEl.style.display = 'none';
            }, 5000);
        }
        
        // ==================== 初始化圖表 ====================
        async function initChart() {
            try {
                await loadChartJsFinancial();
                
                const ctx = document.getElementById('klineChart').getContext('2d');
                chart = new Chart(ctx, {
                    type: 'candlestick',
                    data: {
                        datasets: [{
                            label: currentSymbol,
                            data: [],
                            color: {
                                up: '#4cd964',
                                down: '#ff3b30',
                                unchanged: '#8e8e93',
                            }
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                            tooltip: { enabled: true }
                        },
                        scales: {
                            x: { 
                                type: 'time',
                                time: { unit: 'day' },
                                grid: { color: '#2a2f33' }
                            },
                            y: { 
                                grid: { color: '#2a2f33' }
                            }
                        }
                    }
                });
            } catch (error) {
                console.error('Chart init error:', error);
            }
        }
        
        // ==================== 載入Chart.js Financial ====================
        function loadChartJsFinancial() {
            return new Promise((resolve, reject) => {
                if (typeof Chart !== 'undefined' && Chart.controllers.candlestick) {
                    resolve();
                    return;
                }
                
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.1.0/dist/chartjs-chart-financial.min.js';
                script.onload = resolve;
                script.onerror = reject;
                document.head.appendChild(script);
            });
        }
        
        // ==================== 獲取所有數據 ====================
        async function fetchAllData() {
            try {
                await Promise.all([
                    fetchTicker('BTCUSDT'),
                    fetchTicker('ETHUSDT'),
                    fetchTicker('BNBUSDT'),
                    fetchTicker('SOLUSDT'),
                    fetchKlineData(currentSymbol, currentInterval)
                ]);
                
                document.getElementById('updateTime').textContent = 
                    '最後更新: ' + new Date().toLocaleTimeString('zh-HK');
                retryCount = 0;
                
            } catch (error) {
                console.error('Fetch all error:', error);
                showError('連線失敗，使用備用數據');
                useFallbackData();
            }
        }
        
        // ==================== 使用備用數據 ====================
        function useFallbackData() {
            // 用fallback數據更新介面
            for (let [symbol, data] of Object.entries(fallbackData)) {
                updateTickerDisplay(symbol, data);
            }
            
            // 生成假K線數據
            generateFakeKlineData();
        }
        
        // ==================== 獲取Ticker數據 ====================
        async function fetchTicker(symbol) {
            const card = document.getElementById(symbol.replace('USDT', '').toLowerCase() + 'Card');
            card?.classList.add('loading');
            
            try {
                // 嘗試用cors-proxy
                const url = USE_PROXY ? BINANCE_CORS_PROXY + BINANCE_API + `/ticker/24hr?symbol=${symbol}` : `${BINANCE_API}/ticker/24hr?symbol=${symbol}`;
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                
                const response = await fetch(url, { 
                    signal: controller.signal,
                    mode: 'cors',
                    headers: { 'Content-Type': 'application/json' }
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                updateTickerDisplay(symbol, data);
                
            } catch (error) {
                console.error(`Error fetching ${symbol}:`, error);
                
                // 用fallback數據
                if (fallbackData[symbol]) {
                    updateTickerDisplay(symbol, fallbackData[symbol]);
                }
                
            } finally {
                card?.classList.remove('loading');
            }
        }
        
        // ==================== 更新Ticker顯示 ====================
        function updateTickerDisplay(symbol, data) {
            const prefix = symbol.replace('USDT', '').toLowerCase();
            const price = parseFloat(data.price || data.lastPrice || data.price || 0).toFixed(2);
            const change = parseFloat(data.change || data.priceChangePercent || 0).toFixed(2);
            const high = parseFloat(data.high || data.highPrice || 0).toFixed(2);
            const low = parseFloat(data.low || data.lowPrice || 0).toFixed(2);
            
            document.getElementById(`${prefix}Price`).textContent = '$' + price;
            document.getElementById(`${prefix}Change`).textContent = change + '%';
            document.getElementById(`${prefix}Change`).className = 
                parseFloat(change) >= 0 ? 'card-sub positive' : 'card-sub negative';
            
            // 如果係當前選擇嘅幣種，更新詳細數據
            if (symbol === currentSymbol) {
                updateDetailedAnalysis(data);
            }
        }
        
        // ==================== 更新詳細分析 ====================
        function updateDetailedAnalysis(data) {
            const price = parseFloat(data.price || data.lastPrice || 0);
            const change = parseFloat(data.change || data.priceChangePercent || 0);
            const high = parseFloat(data.high || data.highPrice || 0);
            const low = parseFloat(data.low || data.lowPrice || 0);
            
            document.getElementById('currentPrice').textContent = '$' + price.toFixed(2);
            document.getElementById('priceRange').textContent = 
                `24h高: $${high.toFixed(2)} | 低: $${low.toFixed(2)}`;
            
            // 計算RSI (簡單版)
            const rsi = calculateRSI(change);
            document.getElementById('rsiValue').textContent = rsi.toFixed(1);
            const rsiDesc = rsi > 70 ? '超買' : rsi < 30 ? '超賣' : '中性';
            document.getElementById('rsiDesc').textContent = rsiDesc;
            document.getElementById('rsiValue').style.color = 
                rsi > 70 ? '#ff3b30' : rsi < 30 ? '#4cd964' : '#ffd700';
            
            // 趨勢
            const trend = change >= 0 ? '上升' : '下降';
            document.getElementById('trend').textContent = trend;
            document.getElementById('trendStrength').textContent = 
                `強度: ${Math.abs(change)}%`;
            document.getElementById('trend').style.color = 
                trend === '上升' ? '#4cd964' : '#ff3b30';
            
            // 支撐阻力
            const support = (low * 0.95).toFixed(2);
            const resistance = (high * 1.05).toFixed(2);
            document.getElementById('supportResistance').textContent = 
                `$${support} / $${resistance}`;
            document.getElementById('srDistance').textContent = 
                `距支撐: ${((price - low)/price*100).toFixed(1)}% | 距阻力: ${((high - price)/price*100).toFixed(1)}%`;
            
            // 生成信號
            generateSignals(data, rsi);
        }
        
        // ==================== 計算RSI ====================
        function calculateRSI(change) {
            // 簡單RSI計算
            if (change > 0) {
                return 50 + Math.min(change * 2, 50);
            } else {
                return 50 - Math.min(Math.abs(change) * 2, 50);
            }
        }
        
        // ==================== 獲取K線數據 ====================
        async function fetchKlineData(symbol, interval) {
            document.getElementById('chartError').style.display = 'none';
            
            try {
                const url = USE_PROXY ? BINANCE_CORS_PROXY + BINANCE_API + `/klines?symbol=${symbol}&interval=${interval}&limit=100` : `${BINANCE_API}/klines?symbol=${symbol}&interval=${interval}&limit=100`;
                
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 5000);
                
                const response = await fetch(url, { 
                    signal: controller.signal,
                    mode: 'cors'
                });
                
                clearTimeout(timeoutId);
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const data = await response.json();
                
                const candlestickData = data.map(k => ({
                    x: new Date(k[0]),
                    o: parseFloat(k[1]),
                    h: parseFloat(k[2]),
                    l: parseFloat(k[3]),
                    c: parseFloat(k[4])
                }));
                
                updateChart(candlestickData);
                
            } catch (error) {
                console.error('Error fetching kline data:', error);
                document.getElementById('chartError').style.display = 'block';
                generateFakeKlineData();
            }
        }
        
        // ==================== 生成假K線數據 ====================
        function generateFakeKlineData() {
            const data = [];
            const now = Date.now();
            let basePrice = 50000;
            
            for (let i = 100; i >= 0; i--) {
                const time = now - i * 24 * 60 * 60 * 1000;
                const change = (Math.random() - 0.5) * 1000;
                const open = basePrice + change;
                const close = open + (Math.random() - 0.5) * 500;
                const high = Math.max(open, close) + Math.random() * 300;
                const low = Math.min(open, close) - Math.random() * 300;
                
                data.push({
                    x: new Date(time),
                    o: open,
                    h: high,
                    l: low,
                    c: close
                });
                
                basePrice = close;
            }
            
            updateChart(data);
        }
        
        // ==================== 更新圖表 ====================
        function updateChart(data) {
            if (!chart) return;
            
            chart.data.datasets[0].data = data;
            chart.data.datasets[0].label = currentSymbol;
            chart.update();
        }
        
        // ==================== 生成信號 ====================
        function generateSignals(data, rsi) {
            const signals = [];
            const change = parseFloat(data.change || data.priceChangePercent || 0);
            const volume = parseFloat(data.volume || 0);
            
            // RSI信號
            if (rsi > 70) {
                signals.push({
                    type: 'sell',
                    text: 'RSI超買，可能回調',
                    strength: Math.min((rsi - 70) * 3, 30)
                });
            } else if (rsi < 30) {
                signals.push({
                    type: 'buy',
                    text: 'RSI超賣，可能反彈',
                    strength: Math.min((30 - rsi) * 3, 30)
                });
            }
            
            // 成交量信號 (如果有)
            if (volume > 1000000) {
                signals.push({
                    type: change > 0 ? 'buy' : 'sell',
                    text: '成交量異常放大',
                    strength: 25
                });
            }
            
            // 趨勢信號
            if (Math.abs(change) > 5) {
                signals.push({
                    type: change > 0 ? 'buy' : 'sell',
                    text: '強烈趨勢',
                    strength: 20
                });
            }
            
            // 價格位置信號
            const high = parseFloat(data.high || data.highPrice || 0);
            const low = parseFloat(data.low || data.lowPrice || 0);
            const current = parseFloat(data.price || data.lastPrice || 0);
            
            if (high > 0 && low > 0) {
                const position = (current - low) / (high - low);
                
                if (position > 0.8) {
                    signals.push({
                        type: 'sell',
                        text: '接近24h高位',
                        strength: 15
                    });
                } else if (position < 0.2) {
                    signals.push({
                        type: 'buy',
                        text: '接近24h低位',
                        strength: 15
                    });
                }
            }
            
            updateSignalsList(signals);
            updateRecommendation(signals, change);
        }
        
        // ==================== 更新信號列表 ====================
        function updateSignalsList(signals) {
            const container = document.getElementById('signalsList');
            document.getElementById('signalCount').textContent = signals.length + '個信號';
            
            if (signals.length === 0) {
                container.innerHTML = `
                    <div class="signal-item signal-neutral">
                        <div class="signal-icon">⚪</div>
                        <div class="signal-text">無明顯信號</div>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = signals.map(s => `
                <div class="signal-item signal-${s.type}">
                    <div class="signal-icon">${s.type === 'buy' ? '🟢' : s.type === 'sell' ? '🔴' : '⚪'}</div>
                    <div class="signal-text">${s.text}</div>
                    <div class="signal-strength">強度: ${s.strength}%</div>
                </div>
            `).join('');
        }
        
        // ==================== 更新建議 ====================
        function updateRecommendation(signals, change) {
            let buyScore = 50;
            let sellScore = 50;
            
            signals.forEach(s => {
                if (s.type === 'buy') buyScore += s.strength;
                if (s.type === 'sell') sellScore += s.strength;
            });
            
            // 加入趨勢影響
            if (change > 0) buyScore += Math.min(change, 20);
            if (change < 0) sellScore += Math.min(Math.abs(change), 20);
            
            const total = buyScore + sellScore;
            const buyRatio = buyScore / total;
            
            let action, confidence, color;
            if (buyRatio > 0.6) {
                action = '買入';
                confidence = Math.min(buyRatio * 100, 95);
                color = '#4cd964';
            } else if (buyRatio < 0.4) {
                action = '賣出';
                confidence = Math.min((1 - buyRatio) * 100, 95);
                color = '#ff3b30';
            } else {
                action = '觀望';
                confidence = 50;
                color = '#ffd700';
            }
            
            document.getElementById('recAction').textContent = action;
            document.getElementById('recAction').style.color = color;
            document.getElementById('recConfidence').textContent = `信心指數: ${confidence.toFixed(1)}%`;
            document.getElementById('confidenceFill').style.width = confidence + '%';
        }
        
        // ==================== 改變幣種 ====================
        function changeSymbol(symbol) {
            currentSymbol = symbol;
            
            // 更新active狀態
            document.querySelectorAll('.coin-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`btn${symbol.replace('USDT', '')}`).classList.add('active');
            
            // 重新獲取數據
            showLoading(true);
            Promise.all([
                fetchTicker(currentSymbol),
                fetchKlineData(currentSymbol, currentInterval)
            ]).finally(() => {
                showLoading(false);
            });
        }
        
        // ==================== 改變時間間隔 ====================
        function changeInterval(interval) {
            currentInterval = interval;
            
            // 更新active狀態
            document.querySelectorAll('.interval-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === interval) {
                    btn.classList.add('active');
                }
            });
            
            // 重新獲取K線數據
            showLoading(true);
            fetchKlineData(currentSymbol, currentInterval).finally(() => {
                showLoading(false);
            });
        }
        
        // ==================== 重試 ====================
        function retryFetch() {
            showLoading(true);
            retryCount++;
            
            if (retryCount > maxRetries) {
                USE_PROXY = true;
            }
            
            fetchAllData().finally(() => {
                showLoading(false);
            });
        }
        
        function retryKline() {
            showLoading(true);
            fetchKlineData(currentSymbol, currentInterval).finally(() => {
                showLoading(false);
            });
        }
        
        // ==================== 清理 ====================
        window.addEventListener('beforeunload', function() {
            if (updateInterval) {
                clearInterval(updateInterval);
            }
        });
    </script>
</body>
