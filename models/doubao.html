<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🤬 豆撚寶</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #0b141a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            padding: 10px;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background: #0b141a;
            border-radius: 30px;
            overflow: hidden;
            border: 2px solid #00a884;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }
        
        .header {
            background: #202c33;
            color: white;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid #2a3942;
        }
        
        .avatar {
            width: 60px;
            height: 60px;
            background: #ff3b30;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 35px;
            position: relative;
        }
        
        .online {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 14px;
            height: 14px;
            background: #4caf50;
            border-radius: 50%;
            border: 2px solid #202c33;
        }
        
        .status {
            flex: 1;
        }
        
        .status h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }
        
        .status p {
            font-size: 14px;
            color: #8696a0;
        }
        
        /* 權限提示 */
        .permission-box {
            background: #1e2a32;
            margin: 20px;
            padding: 25px;
            border-radius: 20px;
            border: 2px solid #ff3b30;
            text-align: center;
        }
        
        .mic-icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); color: #ff3b30; }
        }
        
        .permission-title {
            color: white;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .permission-text {
            color: #8696a0;
            font-size: 16px;
            margin-bottom: 25px;
        }
        
        .allow-btn {
            background: #00a884;
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 50px;
            font-size: 22px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            margin-bottom: 15px;
        }
        
        .allow-btn:active {
            background: #008f70;
            transform: scale(0.98);
        }
        
        .test-btn {
            background: #ff3b30;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 18px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 15px;
        }
        
        .ios-guide {
            background: #2a3942;
            border-radius: 15px;
            padding: 20px;
            text-align: left;
            color: white;
            margin-top: 20px;
        }
        
        .ios-guide h3 {
            color: #ff3b30;
            margin-bottom: 15px;
            font-size: 20px;
        }
        
        .ios-guide li {
            margin-left: 25px;
            margin-bottom: 10px;
            color: #8696a0;
        }
        
        /* Chat Area */
        .chat-area {
            display: none;
            padding: 20px;
        }
        
        .messages {
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            position: relative;
        }
        
        .user-message {
            background: #00a884;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        .ai-message {
            background: #202c33;
            color: white;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        
        .time {
            font-size: 11px;
            color: #8696a0;
            margin-top: 4px;
            margin-left: 8px;
        }
        
        .input-area {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #202c33;
            border-radius: 30px;
            margin-top: 15px;
        }
        
        .voice-btn {
            background: #2a3942;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: white;
            font-size: 24px;
            cursor: pointer;
        }
        
        .voice-btn.listening {
            background: #ff3b30;
            animation: pulse 1s infinite;
        }
        
        .text-input {
            flex: 1;
            background: #2a3942;
            border: none;
            border-radius: 25px;
            padding: 12px 20px;
            color: white;
            font-size: 16px;
            outline: none;
        }
        
        .send-btn {
            background: #00a884;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            cursor: pointer;
        }
        
        #debugInfo {
            color: #ff3b30;
            font-size: 12px;
            margin: 10px;
            padding: 10px;
            background: #1e2a32;
            border-radius: 10px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="avatar">
                🤬
                <span class="online"></span>
            </div>
            <div class="status">
                <h2>豆撚寶</h2>
                <p id="statusText">等待權限中...</p>
            </div>
        </div>
        
        <!-- 權限檢查區 -->
        <div id="permissionArea" class="permission-box">
            <div class="mic-icon">🎤</div>
            <div class="permission-title">開咪講嘢！</div>
            <div class="permission-text">我要用咪高峰先可以同你吹水</div>
            
            <button class="allow-btn" onclick="requestMicrophone()">
                允許使用咪高峰
            </button>
            
            <button class="test-btn" onclick="testAudio()">
                🔈 測試喇叭
            </button>
            
            <div id="debugInfo"></div>
            
            <div class="ios-guide">
                <h3>📱 iOS 急救包</h3>
                <ol>
                    <li>㩒上面紅色掣</li>
                    <li>彈出視窗㩒「允許」</li>
                    <li>如果冇彈：設定 > Safari > 相機與麥克風 > 允許</li>
                    <li>然後重新load網頁</li>
                </ol>
            </div>
        </div>
        
        <!-- 傾計區 (一開始隱藏) -->
        <div id="chatArea" class="chat-area">
            <div class="messages" id="messages">
                <div class="message ai-message">
                    屌！終於開到咪啦！講啦！
                </div>
                <div class="time">剛剛</div>
            </div>
            
            <div class="input-area">
                <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()">🎤</button>
                <input type="text" class="text-input" id="messageInput" placeholder="打字都得" autocomplete="off">
                <button class="send-btn" onclick="sendTextMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        let audioStream = null;
        let recognition = null;
        let isListening = false;
        let hasPermission = false;
        
        const debug = document.getElementById('debugInfo');
        const permissionArea = document.getElementById('permissionArea');
        const chatArea = document.getElementById('chatArea');
        const statusText = document.getElementById('statusText');
        
        // 檢查權限
        async function checkMicrophonePermission() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const hasMic = devices.some(device => device.kind === 'audioinput');
                
                debug.innerHTML += `🎤 發現咪高峰：${hasMic ? '✅' : '❌'}\n`;
                
                // 嘗試攞權限
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // 成功！
                hasPermission = true;
                audioStream = stream;
                debug.innerHTML += `✅ 權限成功！\n`;
                statusText.innerHTML = 'online • 咪已開';
                
                // 開chat
                permissionArea.style.display = 'none';
                chatArea.style.display = 'block';
                
                // 初始化語音
                initSpeech();
                
                // 出聲
                speak('屌！終於開到咪啦！講啦！');
                
                return true;
                
            } catch (err) {
                debug.innerHTML += `❌ 錯誤：${err.message}\n`;
                statusText.innerHTML = 'offline • 未開咪';
                return false;
            }
        }
        
        // 要求權限
        async function requestMicrophone() {
            debug.innerHTML = '⏳ 要求權限中...\n';
            await checkMicrophonePermission();
        }
        
        // 測試喇叭
        function testAudio() {
            const audio = new Audio();
            audio.src = 'data:audio/wav;base64,UklGRlwAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YVAAAAA8Pzw8PDw8PDw8PDw8PDw8PDw8PDw8PDw8PDw8PDw8PDw8PDw8PDw8PDw8PDw8PDw8PA==';
            audio.play().then(() => {
                debug.innerHTML += '🔊 喇叭正常\n';
            }).catch(() => {
                debug.innerHTML += '❌ 喇叭有問題\n';
            });
        }
        
        // 初始化語音識別
        function initSpeech() {
            if (!('webkitSpeechRecognition' in window)) {
                alert('❌ 你個browser唔支援語音！');
                return;
            }
            
            recognition = new webkitSpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'zh-HK';
            recognition.maxAlternatives = 1;
            
            recognition.onstart = function() {
                isListening = true;
                document.getElementById('voiceBtn').classList.add('listening');
                document.getElementById('voiceBtn').innerHTML = '⏹️';
                addMessage('🎤 聽緊...', 'ai');
            };
            
            recognition.onend = function() {
                isListening = false;
                document.getElementById('voiceBtn').classList.remove('listening');
                document.getElementById('voiceBtn').innerHTML = '🎤';
            };
            
            recognition.onresult = function(event) {
                const text = event.results[0][0].transcript;
                addMessage(text, 'user');
                
                // AI回應
                setTimeout(() => {
                    const reply = getReply(text);
                    addMessage(reply, 'ai');
                    speak(reply);
                }, 800);
            };
            
            recognition.onerror = function(event) {
                debug.innerHTML += `❌ 語音錯誤：${event.error}\n`;
            };
        }
        
        // 開始/停止錄音
        function toggleVoice() {
            if (!hasPermission) {
                alert('未開咪！撳上面「允許使用咪高峰」');
                return;
            }
            
            if (!recognition) {
                initSpeech();
            }
            
            if (isListening) {
                recognition.stop();
            } else {
                recognition.start();
            }
        }
        
        // 打字send
        function sendTextMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            
            addMessage(text, 'user');
            input.value = '';
            
            setTimeout(() => {
                const reply = getReply(text);
                addMessage(reply, 'ai');
                speak(reply);
            }, 500);
        }
        
        // 加message
        function addMessage(text, sender) {
            const messages = document.getElementById('messages');
            const time = new Date().toLocaleTimeString('zh-HK', { hour: '2-digit', minute: '2-digit' });
            
            messages.innerHTML += `
                <div class="message ${sender === 'user' ? 'user-message' : 'ai-message'}">
                    ${text}
                </div>
                <div class="time">${time}</div>
            `;
            messages.scrollTop = messages.scrollHeight;
        }
        
        // 串嘴回應
        function getReply(msg) {
            msg = msg.toLowerCase();
            
            const replies = {
                '你好': '屌！你好吖！',
                'on9': 'on9仔！',
                '屌你': '屌我？我先屌你！',
                '柒頭': '柒頭叫邊個？',
                '收皮': '收皮？我收你先！',
                '食咩': '食屎啦！',
                '天氣': '熱到仆街！',
                '時間': new Date().toLocaleTimeString(),
                '我愛你': '愛你老母！',
                'help': 'help你老母'
            };
            
            for (let [key, value] of Object.entries(replies)) {
                if (msg.includes(key)) return value;
            }
            
            const random = ['噏乜春？', '講人話啦', 'on9仔', '聽唔明呀'][Math.floor(Math.random() * 4)];
            return random;
        }
        
        // 語音輸出
        function speak(text) {
            if (!('speechSynthesis' in window)) return;
            
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-HK';
            utterance.rate = 1.2;
            utterance.pitch = 1.5;
            utterance.volume = 1;
            
            // 揀把聲
            const voices = window.speechSynthesis.getVoices();
            const chineseVoice = voices.find(v => v.lang.includes('zh') || v.lang.includes('cmn'));
            if (chineseVoice) utterance.voice = chineseVoice;
            
            window.speechSynthesis.speak(utterance);
        }
        
        // 自動check權限
        window.onload = function() {
            debug.innerHTML = '⏳ 檢查權限中...\n';
            debug.innerHTML += '📱 ' + navigator.userAgent + '\n';
            
            // 唔自動彈，等用戶撳制
        };
        
        // 預載voices
        if ('speechSynthesis' in window) {
            window.speechSynthesis.getVoices();
        }
    </script>
</body>
</html>
