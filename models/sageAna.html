<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAGE 量化終端 - Binance 直連版</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    :root {
        --bg: #000000;
        --panel-bg: #0a0a0a;
        --border: #333333;
        --text-main: #e0e0e0;
        --text-muted: #888888;
        --color-bull: #00ff00;
        --color-bear: #ff3333;
        --color-flat: #ffcc00;
    }
    
    * { box-sizing: border-box; }
    
    body {
        background-color: var(--bg);
        color: var(--text-main);
        font-family: "Courier New", Courier, "Lucida Sans Typewriter", monospace;
        margin: 0;
        padding: 15px;
        font-size: 13px;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid var(--border);
        padding-bottom: 10px;
        margin-bottom: 15px;
    }

    .header h1 {
        font-size: 18px;
        margin: 0;
        font-weight: bold;
        letter-spacing: 2px;
    }

    .controls { display: flex; gap: 10px; }

    select, button {
        background-color: var(--bg);
        color: var(--text-main);
        border: 1px solid var(--border);
        padding: 6px 12px;
        font-family: inherit;
        font-size: 13px;
        cursor: pointer;
        outline: none;
    }

    select:hover, button:hover { border-color: var(--text-muted); }
    button:active { background-color: #222; }

    .grid-top {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 15px;
    }

    .panel {
        background-color: var(--panel-bg);
        border: 1px solid var(--border);
        padding: 12px;
    }

    .panel-title {
        font-size: 12px;
        color: var(--text-muted);
        margin-bottom: 8px;
    }

    .data-value { font-size: 18px; font-weight: bold; }

    .grid-mid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 10px;
        margin-bottom: 15px;
    }

    .prob-container {
        display: flex;
        height: 24px;
        border: 1px solid var(--border);
        margin-bottom: 10px;
    }

    .prob-seg {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        color: #000;
        font-weight: bold;
        transition: width 0.3s ease;
    }

    .prob-bear { background-color: var(--color-bear); color: #fff; }
    .prob-flat { background-color: var(--color-flat); }
    .prob-bull { background-color: var(--color-bull); }

    .data-table { width: 100%; border-collapse: collapse; }
    .data-table td { padding: 8px 0; border-bottom: 1px dashed var(--border); }
    .data-table td:last-child { text-align: right; font-weight: bold; }

    .chart-container { height: 350px; width: 100%; position: relative; }

    .text-bull { color: var(--color-bull); }
    .text-bear { color: var(--color-bear); }
    .text-flat { color: var(--color-flat); }

    #status-bar {
        margin-top: 10px;
        font-size: 12px;
        color: var(--text-muted);
        border-top: 1px solid var(--border);
        padding-top: 10px;
    }

    @media (max-width: 768px) {
        .grid-top { grid-template-columns: 1fr 1fr; }
        .grid-mid { grid-template-columns: 1fr; }
        .header { flex-direction: column; align-items: flex-start; gap: 10px; }
    }
</style>
</head>
<body>

<div class="header">
    <h1>SAGE 量化終端系統</h1>
    <div class="controls">
        <select id="asset">
            <optgroup label="主流加密貨幣">
                <option value="BTCUSDT">比特幣 (BTC/USDT)</option>
                <option value="ETHUSDT">以太坊 (ETH/USDT)</option>
                <option value="SOLUSDT">Solana (SOL/USDT)</option>
                <option value="BNBUSDT">幣安幣 (BNB/USDT)</option>
            </optgroup>
            <optgroup label="大宗商品 (黃金)">
                <option value="PAXGUSDT">黃金代幣 (PAXG/USDT - 模擬金價)</option>
            </optgroup>
            <optgroup label="外匯模擬">
                <option value="EURUSDT">歐元/美元 (EUR/USDT)</option>
            </optgroup>
        </select>
        <select id="interval">
            <option value="15m">15 分鐘</option>
            <option value="1h" selected>1 小時</option>
            <option value="4h">4 小時</option>
            <option value="1d">1 日</option>
        </select>
        <button onclick="executeAnalysis()" id="runBtn">[ 執行分析 ]</button>
    </div>
</div>

<div class="grid-top">
    <div class="panel"><div class="panel-title">最新價格</div><div class="data-value" id="val-price">--</div></div>
    <div class="panel"><div class="panel-title">一階導數 (速度/動量)</div><div class="data-value" id="val-d1">--</div></div>
    <div class="panel"><div class="panel-title">二階導數 (加速度)</div><div class="data-value" id="val-d2">--</div></div>
    <div class="panel"><div class="panel-title">SAGE 建議信號</div><div class="data-value" id="val-signal" style="font-size: 18px;">--</div></div>
</div>

<div class="grid-mid">
    <div class="panel">
        <div class="panel-title">資產價格走勢</div>
        <div class="chart-container"><canvas id="priceChart"></canvas></div>
    </div>
    <div class="panel">
        <div class="panel-title">貝氏平滑：市場狀態概率</div>
        <div class="prob-container">
            <div class="prob-seg prob-bear" id="bar-bear" style="width: 33.3%;">熊市</div>
            <div class="prob-seg prob-flat" id="bar-flat" style="width: 33.3%;">橫行</div>
            <div class="prob-seg prob-bull" id="bar-bull" style="width: 33.3%;">牛市</div>
        </div>
        <table class="data-table" style="margin-top: 15px;">
            <tr><td>波動率估算 (%)</td><td id="val-vol" class="text-flat">--</td></tr>
            <tr><td>樣本數量 (K線)</td><td id="val-samples">--</td></tr>
        </table>
        <div style="margin-top: 15px; font-size: 12px; color: var(--text-muted); line-height: 1.5;">
            * 本系統基於高階導數與貝氏推論進行純分析。<br>
            * 數據源：Binance 開放 API (免代理直連)。<br>
            * 不構成任何投資建議。
        </div>
    </div>
</div>

<div id="status-bar">狀態：待機中...</div>

<script>
    let chartInstance = null;

    // 貝氏平滑 (Dirichlet Prior)
    function bayesianSmoothing(probs, eta = 0.01) {
        const n = probs.length;
        const prior = eta / n;
        const total = probs.reduce((a, b) => a + b, 0) + prior * n;
        return probs.map(p => (p + prior) / total);
    }

    // 計算導數 (有限差分)
    function calcDerivatives(arr) {
        const d1 = new Array(arr.length).fill(0);
        const d2 = new Array(arr.length).fill(0);
        for (let i = 1; i < arr.length; i++) d1[i] = arr[i] - arr[i - 1];
        for (let i = 1; i < d1.length; i++) d2[i] = d1[i] - d1[i - 1];
        return { d1, d2 };
    }

    async function executeAnalysis() {
        const symbol = document.getElementById('asset').value;
        const interval = document.getElementById('interval').value;
        const statusBar = document.getElementById('status-bar');
        const runBtn = document.getElementById('runBtn');
        
        document.getElementById('val-signal').innerText = "分析中...";
        document.getElementById('val-signal').style.color = 'var(--text-main)';
        runBtn.disabled = true;
        runBtn.innerText = "[ 運算中... ]";

        try {
            statusBar.innerText = `狀態：正在從 Binance 獲取 ${symbol} 數據...`;
            statusBar.style.color = 'var(--text-main)';

            // 直接請求 Binance API，完全無 CORS 問題
            const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=200`;
            const res = await fetch(url);
            
            if (!res.ok) throw new Error("Binance API 請求失敗");
            
            const data = await res.json();
            if (!Array.isArray(data)) throw new Error("API 返回格式錯誤");

            // 提取收盤價 (第 5 個元素)
            const prices = data.map(d => parseFloat(d[4]));
            const latestPrice = prices[prices.length - 1];

            statusBar.innerText = `狀態：正在計算微積分與貝氏概率...`;

            // 計算對數收益率
            const logRets = [];
            for (let i = 1; i < prices.length; i++) {
                logRets.push(Math.log(prices[i] / prices[i - 1]));
            }

            // 計算一階與二階導數
            const { d1, d2 } = calcDerivatives(logRets);
            const lastD1 = d1[d1.length - 1];
            const lastD2 = d2[d2.length - 1];

            // 波動率計算
            const mean = logRets.reduce((a,b)=>a+b, 0) / logRets.length;
            const variance = logRets.reduce((a,b)=>a+Math.pow(b-mean, 2), 0) / logRets.length;
            const vol = Math.sqrt(variance) * Math.sqrt(252) * 100;

            // 貝氏概率計算 (跌、平、升)
            const threshold = Math.abs(mean) * 0.5 + 0.0001;
            let up = 0, down = 0, flat = 0;
            logRets.forEach(r => {
                if (r > threshold) up++;
                else if (r < -threshold) down++;
                else flat++;
            });
            const rawProbs = [down / logRets.length, flat / logRets.length, up / logRets.length];
            const probs = bayesianSmoothing(rawProbs);

            // 信號生成邏輯
            let signalText = "觀望";
            let signalColor = "var(--text-main)";
            
            if (lastD1 > 0 && lastD2 > 0 && probs[2] > 0.4) {
                signalText = "偏多 (做多)";
                signalColor = "var(--color-bull)";
            } else if (lastD1 < 0 && lastD2 < 0 && probs[0] > 0.4) {
                signalText = "偏空 (做空)";
                signalColor = "var(--color-bear)";
            } else if (Math.abs(lastD1) < 0.00001) {
                signalText = "區間震盪";
                signalColor = "var(--color-flat)";
            }

            // 更新介面
            document.getElementById('val-price').innerText = latestPrice.toFixed(latestPrice > 1000 ? 2 : 4);
            
            const d1El = document.getElementById('val-d1');
            d1El.innerText = lastD1.toFixed(6);
            d1El.className = `data-value ${lastD1 > 0 ? 'text-bull' : 'text-bear'}`;

            const d2El = document.getElementById('val-d2');
            d2El.innerText = lastD2.toFixed(6);
            d2El.className = `data-value ${lastD2 > 0 ? 'text-bull' : 'text-bear'}`;

            const sigEl = document.getElementById('val-signal');
            sigEl.innerText = signalText;
            sigEl.style.color = signalColor;

            // 更新概率條
            const barBear = document.getElementById('bar-bear');
            const barFlat = document.getElementById('bar-flat');
            const barBull = document.getElementById('bar-bull');
            
            barBear.style.width = (probs[0] * 100) + '%';
            barFlat.style.width = (probs[1] * 100) + '%';
            barBull.style.width = (probs[2] * 100) + '%';

            barBear.innerText = `熊市 ${(probs[0]*100).toFixed(0)}%`;
            barFlat.innerText = `橫行 ${(probs[1]*100).toFixed(0)}%`;
            barBull.innerText = `牛市 ${(probs[2]*100).toFixed(0)}%`;

            // 更新表格
            document.getElementById('val-vol').innerText = vol.toFixed(2) + '%';
            document.getElementById('val-samples').innerText = logRets.length;

            // 繪製圖表
            renderChart(prices);

            statusBar.innerText = `狀態：分析完成 | 時間：${new Date().toLocaleTimeString('zh-HK')}`;
            statusBar.style.color = 'var(--color-bull)';

        } catch (error) {
            console.error(error);
            statusBar.innerText = `狀態：錯誤 - ${error.message}`;
            statusBar.style.color = 'var(--color-bear)';
            document.getElementById('val-signal').innerText = "分析失敗";
            document.getElementById('val-signal').style.color = 'var(--color-bear)';
        } finally {
            runBtn.disabled = false;
            runBtn.innerText = "[ 執行分析 ]";
        }
    }

    function renderChart(prices) {
        const ctx = document.getElementById('priceChart').getContext('2d');
        if (chartInstance) chartInstance.destroy();
        
        chartInstance = new Chart(ctx, {
            type: 'line',
            data: {
                labels: Array.from({length: prices.length}, (_, i) => i),
                datasets: [{
                    data: prices,
                    borderColor: '#3399ff',
                    borderWidth: 1,
                    pointRadius: 0,
                    fill: false,
                    tension: 0.1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { display: false },
                    y: { 
                        grid: { color: '#222' }, 
                        ticks: { color: '#888', font: { family: 'Courier New, monospace', size: 12 } } 
                    }
                },
                animation: false
            }
        });
    }
</script>

</body>
</html>
