<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>銀行轉賬申請 | 經貸智能財務</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@300;400;500;700&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root {
    --primary: #0052CC; /* 調整為更具現代感的 Royal Blue */
    --primary-light: #E9F2FF;
    --primary-dark: #0747A6;
    --success: #00875A;
    --warning: #FFAB00;
    --error: #DE350B;
    --background: #F4F5F7;
    --card-bg: #FFFFFF;
    --text-main: #172B4D;
    --text-sub: #5E6C84;
    --border: #DFE1E6;
    --radius: 12px;
    --shadow: 0 4px 20px rgba(9, 30, 66, 0.08);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Noto Sans HK', 'Inter', sans-serif;
    background-color: var(--background);
    color: var(--text-main);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
}

/* --- Layout --- */
.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px;
}

header {
    background: var(--card-bg);
    padding: 16px 0;
    position: sticky;
    top: 0;
    z-index: 1000;
    box-shadow: 0 1px 0 var(--border);
}

.nav-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: var(--primary);
    font-weight: 700;
    font-size: 1.25rem;
}

.logo-icon {
    width: 40px;
    height: 40px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border-radius: 10px;
    display: grid;
    place-items: center;
    box-shadow: 0 4px 8px rgba(0,82,204,0.2);
}

/* --- Steps Sidebar --- */
.main-content {
    padding: 48px 0;
}

.content-grid {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 40px;
}

.step-indicator {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.step-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px;
    border-radius: var(--radius);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    background: transparent;
}

.step-item.active {
    background: var(--card-bg);
    box-shadow: var(--shadow);
}

.step-item.completed .step-dot {
    background: var(--success);
    color: white;
}

.step-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--border);
    color: var(--text-sub);
    display: grid;
    place-items: center;
    font-weight: 600;
    font-size: 0.85rem;
    transition: 0.3s;
}

.step-item.active .step-dot {
    background: var(--primary);
    color: white;
    transform: scale(1.1);
}

.step-label {
    font-weight: 500;
    font-size: 0.95rem;
    color: var(--text-sub);
}

.step-item.active .step-label {
    color: var(--primary);
    font-weight: 700;
}

/* --- Application Card --- */
.application-card {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 40px;
    box-shadow: var(--shadow);
    min-height: 600px;
}

h1, h2 { color: var(--text-main); margin-bottom: 12px; }
.card-subtitle { color: var(--text-sub); margin-bottom: 32px; font-size: 1rem; }

/* --- Forms & Inputs --- */
.form-group {
    margin-bottom: 24px;
}

.form-label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
    font-size: 0.9rem;
}

.input-field {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 8px;
    font-size: 1rem;
    transition: all 0.2s;
    background: #FAFBFC;
}

.input-field:focus {
    outline: none;
    border-color: var(--primary);
    background: white;
    box-shadow: 0 0 0 4px var(--primary-light);
}

/* --- Verification Options (Cards) --- */
.verification-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin: 24px 0;
}

.v-option {
    border: 2px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
}

.v-option:hover {
    border-color: var(--primary);
    transform: translateY(-4px);
}

.v-option.selected {
    border-color: var(--primary);
    background: var(--primary-light);
}

.v-icon { font-size: 2rem; margin-bottom: 12px; display: block; }

/* --- Buttons --- */
.btn {
    padding: 14px 28px;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    font-size: 1rem;
    display: inline-flex;
    align-items: center;
    gap: 8px;
}

.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }

.btn-ghost { background: transparent; color: var(--text-sub); }
.btn-ghost:hover { color: var(--primary); }

/* --- Responsive --- */
@media (max-width: 850px) {
    .content-grid { grid-template-columns: 1fr; }
    .step-indicator { flex-direction: row; overflow-x: auto; padding-bottom: 16px; }
    .step-item { flex: 0 0 auto; padding: 10px; }
    .step-label { display: none; }
    .verification-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<header>
    <div class="container nav-container">
        <a href="#" class="logo">
            <div class="logo-icon">$</div>
            <span>經貸智能財務</span>
        </a>
        <nav style="display: flex; gap: 24px;">
            <a href="#" class="btn-ghost" style="text-decoration:none">智能評估</a>
            <a href="#" class="btn btn-primary" style="padding: 8px 16px">銀行轉賬</a>
        </nav>
    </div>
</header>

<div class="container main-content">
    <div class="content-grid">
        <aside class="step-navigation">
            <div class="step-indicator">
                <div class="step-item active">
                    <div class="step-dot">1</div>
                    <div class="step-label">基本資料</div>
                </div>
                <div class="step-item">
                    <div class="step-dot">2</div>
                    <div class="step-label">身份驗證</div>
                </div>
                <div class="step-item">
                    <div class="step-dot">3</div>
                    <div class="step-label">銀行資料</div>
                </div>
                <div class="step-item">
                    <div class="step-dot">4</div>
                    <div class="step-label">確認申請</div>
                </div>
            </div>
            
            <div style="margin-top: 40px; padding: 20px; background: #EBECF0; border-radius: 12px; font-size: 0.85rem;">
                <p style="color: var(--text-sub); margin-bottom: 4px;">放債人牌照號碼</p>
                <p style="font-family: 'Roboto Mono'; font-weight: 600;">0987/2025</p>
            </div>
        </aside>

        <main class="application-card">
            <div id="step1">
                <h2>基本資料</h2>
                <p class="card-subtitle">填寫您的申請金額與年期，系統將自動計算利率。</p>
                
                <div class="form-group">
                    <label class="form-label">申請人全名 (中文)</label>
                    <input type="text" class="input-field" placeholder="陳大文">
                </div>

                <div class="form-group">
                    <label class="form-label">申請金額 (HKD)</label>
                    <input type="number" class="input-field" placeholder="例如: 50,000">
                </div>

                <div class="form-group">
                    <label class="form-label">還款年期</label>
                    <select class="input-field">
                        <option>12 個月 (1年)</option>
                        <option>24 個月 (2年)</option>
                        <option selected>60 個月 (5年)</option>
                    </select>
                </div>

                <div style="margin-top: 40px; display: flex; justify-content: flex-end;">
                    <button class="btn btn-primary">下一步：身份驗證 &rarr;</button>
                </div>
            </div>
            
            <div id="step2" style="display:none;">
                <h2>身份驗證</h2>
                <p class="card-subtitle">請選擇最方便您的驗證方式。</p>
                
                <div class="verification-grid">
                    <div class="v-option">
                        <span class="v-icon">👤</span>
                        <div style="font-weight:600">已註冊用戶</div>
                    </div>
                    <div class="v-option">
                        <span class="v-icon">📸</span>
                        <div style="font-weight:600">人臉比對</div>
                    </div>
                    <div class="v-option">
                        <span class="v-icon">📝</span>
                        <div style="font-weight:600">手動輸入</div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<footer style="margin-top: 80px; padding: 60px 0; background: white; border-top: 1px solid var(--border);">
    <div class="container" style="text-align: center; color: var(--text-sub);">
        <p>© 2025 經貸智能財務有限公司 | 借錢梗要還，咪俾錢中介</p>
    </div>
</footer>

</body>
</html>
